<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPGIA</title>
</head>
<body class="bg-linear-to-b from-[#E3B3C1] to-white h-screen w-full">
    <h1 class="text-center mt-5 static font-[Open Sans]">SIPGIA</h1>
    <p class="box-border border-1  p-10 text-7xl text-center">SIPGIA</p>
    <form action="" method="get">
        <div class="m-10 box-border border-2 p-3 rounded-2xl border-white relative">
            <label for="email">Enter your email: </label>
            <input type="email" name="email" id="email" required />
            <label for="password">Enter your password: </label>
            <input type="password" name="password" id="password" required />
        </div>
        <div class="">
            <button class="bg-[#E3B3C1] hover:bg-[#883A53] text-white font-bold py-2 px-4 rounded block mx-auto w-40 cursor-pointer" type="button box-border">Button</button>
        </div>
    </form>
</body>
</html>
